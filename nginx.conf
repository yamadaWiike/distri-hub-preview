# Nginx configuration for Baskit Distributor Hub
# This file should be placed at /etc/nginx/sites-available/baskit-distributor-hub

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Security headers (matching CSP from application)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Content Security Policy - CRITICAL: This must match the CSP in index.html
    # If both nginx and HTML have CSP headers, nginx takes precedence
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.supabase.co https://api.web3forms.com https://api-dev.baskit.app https://*.google-analytics.com https://*.googletagmanager.com https://*.hotjar.com https://*.hotjar.io https://nominatim.openstreetmap.org https://*.s3.amazonaws.com https://*.s3.*.amazonaws.com https://s3.*.amazonaws.com https://distrihub.s3.ap-southeast-1.amazonaws.com https://*.imagekit.io blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.google.com https://*.gstatic.com https://*.googletagmanager.com https://*.google-analytics.com https://static.hotjar.com https://script.hotjar.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; frame-src 'self'; worker-src 'self' blob:; object-src 'none';" always;

    # Logging
    access_log /var/log/nginx/baskit-access.log;
    error_log /var/log/nginx/baskit-error.log;

    # Proxy settings
    location / {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Important: Don't override security headers from upstream
        # This ensures our CSP header is properly set
        proxy_hide_header Content-Security-Policy;
    }

    # Static files caching with security headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:8081;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Ensure CSP applies to all resources
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.supabase.co https://api.web3forms.com https://api-dev.baskit.app https://*.google-analytics.com https://*.googletagmanager.com https://*.hotjar.com https://*.hotjar.io https://nominatim.openstreetmap.org https://*.s3.amazonaws.com https://*.s3.*.amazonaws.com https://s3.*.amazonaws.com https://distrihub.s3.ap-southeast-1.amazonaws.com https://*.imagekit.io blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.google.com https://*.gstatic.com https://*.googletagmanager.com https://*.google-analytics.com https://static.hotjar.com https://script.hotjar.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; frame-src 'self'; worker-src 'self' blob:; object-src 'none';" always;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
}

# HTTPS/SSL Configuration (after SSL certificate is obtained)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL Configuration (will be added by certbot)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Enhanced Security headers for HTTPS
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy - Same as HTTP but with HTTPS context
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.supabase.co https://api.web3forms.com https://api-dev.baskit.app https://*.google-analytics.com https://*.googletagmanager.com https://*.hotjar.com https://*.hotjar.io https://nominatim.openstreetmap.org https://*.s3.amazonaws.com https://*.s3.*.amazonaws.com https://s3.*.amazonaws.com https://distrihub.s3.ap-southeast-1.amazonaws.com https://*.imagekit.io blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.google.com https://*.gstatic.com https://*.googletagmanager.com https://*.google-analytics.com https://static.hotjar.com https://script.hotjar.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; frame-src 'self'; worker-src 'self' blob:; object-src 'none';" always;

    # Logging
    access_log /var/log/nginx/baskit-ssl-access.log;
    error_log /var/log/nginx/baskit-ssl-error.log;

    # Same proxy configuration as HTTP
    location / {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Hide upstream CSP to prevent conflicts
        proxy_hide_header Content-Security-Policy;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:8081;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.supabase.co https://api.web3forms.com https://api-dev.baskit.app https://*.google-analytics.com https://*.googletagmanager.com https://*.hotjar.com https://*.hotjar.io https://nominatim.openstreetmap.org https://*.s3.amazonaws.com https://*.s3.*.amazonaws.com https://s3.*.amazonaws.com https://distrihub.s3.ap-southeast-1.amazonaws.com https://*.imagekit.io blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.google.com https://*.gstatic.com https://*.googletagmanager.com https://*.google-analytics.com https://static.hotjar.com https://script.hotjar.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; frame-src 'self'; worker-src 'self' blob:; object-src 'none';" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
}